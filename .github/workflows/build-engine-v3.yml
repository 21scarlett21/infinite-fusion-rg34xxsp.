name: Build Infinite Fusion Engine V3

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-24.04-arm

    timeout-minutes: 120

    steps:

      - name: Install build tools

        run: |

          sudo apt-get update

          sudo apt-get install -y software-properties-common

          sudo add-apt-repository -y universe

          sudo apt-get update

          sudo apt-get install -y git build-essential cmake ninja-build pkg-config python3 python3-pip python3-venv libssl-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libopenal-dev libvorbis-dev libogg-dev libphysfs-dev libboost-dev libfreetype6-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libpng-dev libjpeg-dev libfluidsynth-dev liblua5.1-0-dev

      - name: Install newer Meson

        run: |

          python3 -m venv /tmp/meson-env

          /tmp/meson-env/bin/pip install --upgrade meson

          /tmp/meson-env/bin/meson --version

      - name: Download mkxp-z

        run: git clone --recursive https://github.com/mkxp-z/mkxp-z.git engine

      - name: Inspect build files

        run: |

          ls -la engine

          find engine -maxdepth 3 -name meson.build -print

      - name: Attempt ARM64 build

        run: |

          cd engine

          /tmp/meson-env/bin/meson setup build --buildtype=release

          /tmp/meson-env/bin/meson compile -C build

      - name: Upload build files

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: mkxp-z-arm64-v3

          path: engine/build/

          if-no-files-found: ignore
