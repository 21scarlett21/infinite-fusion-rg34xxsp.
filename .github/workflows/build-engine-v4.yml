

name: Build Infinite Fusion Engine V4

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-24.04-arm

    timeout-minutes: 120

    steps:

      - name: Install build tools

        run: |

          sudo apt-get update

          sudo apt-get install -y software-properties-common

          sudo add-apt-repository -y universe

          sudo apt-get update

          sudo apt-get install -y git build-essential cmake ninja-build pkg-config python3 python3-pip python3-venv file binutils libssl-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libopenal-dev libvorbis-dev libogg-dev libphysfs-dev libboost-dev libfreetype6-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libpng-dev libjpeg-dev libfluidsynth-dev liblua5.1-0-dev

      - name: Install Meson

        run: |

          python3 -m venv /tmp/meson-env

          /tmp/meson-env/bin/pip install --upgrade meson

          /tmp/meson-env/bin/meson --version

      - name: Download mkxp-z

        run: |

          git clone --recursive https://github.com/mkxp-z/mkxp-z.git engine

      - name: Configure ARM64 build

        run: |

          /tmp/meson-env/bin/meson setup engine/build engine --buildtype=release

      - name: Compile engine

        run: |

          /tmp/meson-env/bin/meson compile -C engine/build

      - name: Inspect build targets

        run: |

          /tmp/meson-env/bin/meson introspect engine/build --targets > targets.json

          python3 -m json.tool targets.json

      - name: Package executable and diagnostics

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p package/bin package/diagnostics

          cp targets.json package/diagnostics/

          uname -m > package/diagnostics/architecture.txt

          find engine/build -type f -perm /111 -exec file {} \; > package/diagnostics/executable-scan.txt

          python3 - <<'PY'

          import json

          import pathlib

          import shutil

          import subprocess

          targets = json.loads(

              pathlib.Path("targets.json").read_text()

          )

          found = []

          for target in targets:

              if target.get("type") != "executable":

                  continue

              filenames = target.get("filename", [])

              if isinstance(filenames, str):

                  filenames = [filenames]

              for filename in filenames:

                  path = pathlib.Path(filename)

                  if not path.exists():

                      continue

                  info = subprocess.run(

                      ["file", "-b", str(path)],

                      capture_output=True,

                      text=True,

                      check=True,

                  ).stdout.strip()

                  if "ELF" not in info:

                      continue

                  if "ARM aarch64" not in info:

                      continue

                  destination = (

                      pathlib.Path("package/bin") / path.name

                  )

                  shutil.copy2(path, destination)

                  deps = subprocess.run(

                      ["ldd", str(path)],

                      capture_output=True,

                      text=True,

                  )

                  (

                      pathlib.Path("package/diagnostics")

                      / (path.name + ".ldd.txt")

                  ).write_text(

                      deps.stdout + deps.stderr

                  )

                  found.append(path.name)

          pathlib.Path(

              "package/diagnostics/result.txt"

          ).write_text(

              "ARM64 executables: " + repr(found)

          )

          if not found:

              print("No ARM64 executable target was produced.")

              print("See targets.json for available targets.")

              raise SystemExit(1)

          print("Packaged:", found)

          PY

      - name: Upload V4 package

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: mkxp-z-arm64-v4

          path: package/

          if-no-files-found: warn
