name: Build mkxp-z ARM64

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-24.04-arm

    timeout-minutes: 120

    steps:

      - name: Install build tools

        run: |

          sudo apt-get update

          sudo apt-get install -y git build-essential cmake meson ninja-build autoconf automake libtool pkg-config ruby bison zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libgles2-mesa-dev libasound2-dev libpulse-dev xxd

          sudo apt-get update

          sudo apt-get install -y \

            git build-essential cmake meson ninja-build \

            autoconf automake libtool pkg-config \

            ruby bison zlib1g-dev libbz2-dev \

            xorg-dev libgl1-mesa-dev libgles2-mesa-dev \

            libasound2-dev libpulse-dev xxd

      - name: Download mkxp-z

        run: |

          git clone --recursive \

            https://github.com/mkxp-z/mkxp-z.git \

            engine

      - name: Build dependencies

        working-directory: engine/linux

        run: make

      - name: Configure engine

        shell: bash

        run: |

          cd engine

          source linux/vars.sh

          meson setup build --buildtype release \

            -Dgfx_backend=gles

      - name: Compile engine

        shell: bash

        run: |

          cd engine

          source linux/vars.sh

          ninja -C build

      - name: Upload compiled engine

        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: mkxp-z-arm64-test

          path: engine/build/mkxp-z.*
